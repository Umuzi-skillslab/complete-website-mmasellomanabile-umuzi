    <main>
    
    <div>
        <h2>Get In Touch</h2>
        
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            
            <label for="phone">Contact Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="contact number" minlength="10" maxlength="10">
                      
            <label>Preferred Contact Method:</label>
            
            <label for="contact-email">Email</label>
            <input type="radio" id="contact-email" name="contact-method" value="email">
            
            <label for="contact-phone">Phone</label>
            <input type="radio" id="contact-phone" name="contact-method" value="phone">
             <br>       
            <label for="message">Message</label>
            <textarea id="message" name="message"  placeholder="Exter your message"></textarea>
            <br>
            <label for="marketing">Opt me in for offers!</label>
            <input type="checkbox" id="marketing" name="marketing" >
           

            <br><br>
            <button type="submit">Send</button>
        </form>
    </div>
