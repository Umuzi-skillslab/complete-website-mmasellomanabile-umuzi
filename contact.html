<body>
    <header>
        <div class="header">
        <h1>Contact Me</h1>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home: Portfolio</a></li>

            <li><a href="contact.html">Contact</a></li>
            </ul>

    <main>
    
    <div>
        <h2>Get In Touch</h2>
        
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            
            <label for="phone">Contact Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="contact number" minlength="10" maxlength="10">
            
            <label for="message">Message</label>
            <textarea id="message" name="message"  placeholder="Exter your message"></textarea>
            
            <button type="submit">Send</button>
        </form>
    </div>
    </main>        
    <footer>    
        <div class="footer">
        <p>Contact me at email@example.com</p>
        </div>
    </footer>
</body>
</html>
